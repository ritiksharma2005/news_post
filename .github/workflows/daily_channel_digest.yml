name: 📢 Daily Instagram Broadcast Channel Digest (@news.nit_iit -> Telegram)

on:
  # Schedule stopped as requested
  # schedule:
  #   # 11:00 AM IST (05:30 AM UTC) — Morning Channel Roundup
  #   - cron: "30 5 * * *"
  #   # 9:00 PM IST (03:30 PM UTC / 15:30 UTC) — Evening Channel Roundup
  #   - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date: 'today' (default) for today's posts, or enter YYYY-MM-DD"
        required: false
        default: "today"
      run_type:
        description: "Run type: 'auto' (default), 'morning' (11 AM), or 'evening' (9 PM)"
        type: choice
        options:
          - "auto"
          - "morning"
          - "evening"
        required: false
        default: "auto"

jobs:
  run-daily-channel-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Instagram Channel Digest
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # Always run in live production mode with --force so Telegram receives the update every time
          CMD="python daily_channel_digest.py --force"
          DATE_INPUT="${{ inputs.date }}"
          if [ -n "$DATE_INPUT" ]; then
            CMD="$CMD --date=$DATE_INPUT"
          else
            CMD="$CMD --date=today"
          fi
          RUN_TYPE_INPUT="${{ inputs.run_type }}"
          if [ -n "$RUN_TYPE_INPUT" ] && [ "$RUN_TYPE_INPUT" != "auto" ]; then
            CMD="$CMD --run-type=$RUN_TYPE_INPUT"
          else
            CMD="$CMD --run-type=auto"
          fi
          echo "Executing live production run: $CMD"
          eval $CMD

      - name: Commit and Push Database History
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase || true
          git add -f data/channel_digest.db data/published_history.json || true
          git commit -m "Update Channel Digest database history [skip ci]" || true
          git push origin main || true
