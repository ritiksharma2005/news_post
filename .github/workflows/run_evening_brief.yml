name: 🌆 Run Evening English News Brief

on:
  schedule:
    # 6:00 PM IST (12:30 PM UTC)
    - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  run-evening-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Devanagari Hindi Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-deva fonts-noto-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Evening News Brief
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python main.py --mode news
        
