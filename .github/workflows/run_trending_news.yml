name: 🔥 Run Trending News Project

on:
  schedule:
    # 9:00 AM IST (03:30 AM UTC) — Morning Run
    - cron: "30 3 * * *"
    # 8:00 PM IST (02:30 PM UTC / 14:30 UTC) — Evening Run
    - cron: "30 14 * * *"
  workflow_dispatch: {}

jobs:
  run-trending-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Devanagari & Display Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-deva fonts-noto-core fonts-montserrat

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Trending News Pipeline
        env:
          TRENDING_GEMINI_API_KEY: ${{ secrets.TRENDING_GEMINI_API_KEY }}
          TRENDING_GROQ_API_KEY: ${{ secrets.TRENDING_GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          if [ "$(date -u +%H)" -eq "03" ]; then
            python -m trending_news.orchestrator --type=morning --dry-run
          else
            python -m trending_news.orchestrator --type=evening --dry-run
          fi

      - name: Commit and Push Database & Outputs
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase || true
          git add data/trending_news.db output/trending/ || true
          git commit -m "Update Trending News database & output artifact [skip ci]" || true
          git push origin main || true
