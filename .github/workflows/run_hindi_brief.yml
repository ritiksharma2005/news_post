name: 🇮🇳 Run Hindi News Brief

on:
  schedule:
    # 1:30 PM IST (08:00 AM UTC)
    - cron: "0 8 * * *"
    # 8:30 PM IST (03:00 PM UTC)
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  run-hindi-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Devanagari Hindi Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-deva fonts-noto-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Hindi News Brief
        env:
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          if [ "$(date -u +%H)" -eq "08" ]; then
            python main_hindi.py --type=morning
          else
            python main_hindi.py --type=evening
          fi

      - name: Commit and Push History
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase || true
          git add data/ || true
          git commit -m "Update publication history [skip ci]" || true
          git push origin main || true
