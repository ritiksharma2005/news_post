name: 🎬 AI News Anchor Pipeline

on:
  schedule:
    # Runs every 4 hours automatically to check for new posts and send options to Telegram
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "generate_video"
        type: choice
        options:
          - "generate_video"
          - "check_candidates"
          - "approve_job"
          - "reject_job"
      target:
        description: "Post URL, Media ID (or 'latest'), or Job ID for approval"
        required: false
        default: "latest"

jobs:
  run-news-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r news_anchor_ai/requirements.txt

      - name: 🚀 Run AI News Anchor Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          HEDRA_API_KEY: ${{ secrets.HEDRA_API_KEY }}
        run: |
          ACTION="${{ github.event.inputs.action || 'check_candidates' }}"
          TARGET="${{ github.event.inputs.target || 'latest' }}"
          
          echo "=================================================="
          echo "🎬 EXECUTING ACTION: $ACTION"
          echo "📌 TARGET: $TARGET"
          echo "=================================================="
          
          if [ "$ACTION" = "check_candidates" ]; then
            python -u news_anchor_ai/main.py --check-candidates
          elif [ "$ACTION" = "generate_video" ]; then
            if [[ "$TARGET" =~ ^https?:// ]]; then
              python -u news_anchor_ai/main.py --url "$TARGET"
            else
              python -u news_anchor_ai/main.py --generate "$TARGET"
            fi
          elif [ "$ACTION" = "approve_job" ]; then
            python -u news_anchor_ai/main.py --approve "$TARGET"
          elif [ "$ACTION" = "reject_job" ]; then
            python -u news_anchor_ai/main.py --reject "$TARGET"
          else
            python -u news_anchor_ai/main.py --check-candidates
          fi

      - name: 💾 Commit & Push State (processed posts & anchor rotation)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news_anchor_ai/data/ || true
          git commit -m "Update anchor state [skip ci]" || true
          git push origin main || true
