name: 🎬 AI News Anchor Pipeline

on:
  schedule:
    # Runs every 4 hours automatically to check for new posts and send options to Telegram
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "check_candidates"
        type: choice
        options:
          - "check_candidates"
          - "generate_video"
          - "publish_reel"
      post_id:
        description: "Target Instagram Media ID (leave 'latest' for newest post)"
        required: false
        default: "latest"

jobs:
  run-news-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r news_anchor_ai/requirements.txt

      - name: 🚀 Run AI News Anchor Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          ACTION="${{ github.event.inputs.action || 'check_candidates' }}"
          POST_ID="${{ github.event.inputs.post_id || 'latest' }}"
          
          echo "Executing Action: $ACTION"
          
          if [ "$ACTION" = "check_candidates" ]; then
            python news_anchor_ai/main.py --check-candidates
          elif [ "$ACTION" = "generate_video" ]; then
            python news_anchor_ai/main.py --generate "$POST_ID"
          elif [ "$ACTION" = "publish_reel" ]; then
            python news_anchor_ai/main.py --publish "$POST_ID"
          else
            python news_anchor_ai/main.py --check-candidates
          fi

      - name: 💾 Commit & Push State (processed posts & anchor rotation)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news_anchor_ai/data/ || true
          git commit -m "Update anchor state [skip ci]" || true
          git push origin main || true
