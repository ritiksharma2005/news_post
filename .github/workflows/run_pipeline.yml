name: Run News Pipeline

on:
  schedule:
    # Times are in UTC. These correspond to roughly 6am, 12pm, 5pm, 9pm IST.
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
